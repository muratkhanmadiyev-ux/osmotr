<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR-коды для печати</title>
<style>
:root{--ink:#14181d;--line:#d5dbe0;--mark:#f2c200}
body{margin:0;background:#eef1f3;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.panel{max-width:760px;margin:0 auto;padding:22px 18px}
.panel h1{font-size:22px;margin:0 0 6px}
.panel p{color:#5b666f;font-size:15px;margin:0 0 14px}
.panel label{display:block;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.panel input{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff}
.panel button{margin-top:12px;font:inherit;font-weight:800;padding:14px 22px;border:0;border-radius:10px;background:var(--ink);color:#fff;cursor:pointer}
.cards{max-width:760px;margin:0 auto;padding:0 18px 40px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:18px;text-align:center;break-inside:avoid}
.card .top{height:8px;background:repeating-linear-gradient(135deg,var(--mark) 0 10px,#14181d 10px 20px);border-radius:4px;margin-bottom:14px}
.card h2{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
.card .sub{font-size:13px;color:#5b666f;margin-bottom:12px}
.card img{width:100%;max-width:230px;height:auto;display:block;margin:0 auto}
.card .cap{margin-top:12px;font-size:14px;font-weight:700}
.card .hint{margin-top:4px;font-size:12px;color:#5b666f;word-break:break-all}
@media print{
  body{background:#fff}
  .panel{display:none}
  .cards{grid-template-columns:1fr 1fr;gap:10mm;padding:0}
  .card{border-width:1.5px}
}
</style>
</head>
<body>

<div class="panel">
  <h1>QR-коды для печати</h1>
  <p>Вставьте адрес, по которому опубликовано приложение, и нажмите «Собрать коды». Затем — печать: Ctrl+P или Cmd+P.</p>
  <label for="base">Адрес приложения</label>
  <input type="text" id="base" placeholder="https://ваш-логин.github.io/osmotr/index.html">
  <button id="go">Собрать коды</button>
</div>

<div class="cards" id="cards"></div>

<script>
// Список переделов — должен совпадать с POINTS в index.html
const POINTS = [
  { key: "dsk1", name: "ДСК-1", sub: "Бункер, питатель, дробилка" },
  { key: "dsk2", name: "ДСК-2", sub: "Бункер, питатель, дробилка" }
];

const cards = document.getElementById("cards");
const base = document.getElementById("base");
base.value = localStorage.getItem("qrbase") || "";

document.getElementById("go").addEventListener("click", build);
if (base.value) build();

function build(){
  const url = base.value.trim();
  if(!url){ base.focus(); return; }
  localStorage.setItem("qrbase", url);
  cards.innerHTML = "";

  POINTS.forEach(function(p){
    const link = url + (url.indexOf("?") > -1 ? "&" : "?") + "p=" + p.key;
    const img = "https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=10&data=" + encodeURIComponent(link);
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML =
      '<div class="top"></div>' +
      '<h2>' + p.name + '</h2>' +
      '<div class="sub">' + p.sub + '</div>' +
      '<img src="' + img + '" alt="QR-код ' + p.name + '">' +
      '<div class="cap">Отсканируйте перед осмотром</div>' +
      '<div class="hint">' + p.key + '</div>';
    cards.appendChild(el);
  });
}
</script>
</body>
</html>
